name: Build rock

on:
  push:
    branches:
      - main
    paths:
      - rockcraft.yaml
      - rocks/**
      - tests/rock/**
      - crates/**
      - proto/**
      - Cargo.*
      - .github/workflows/rock.yaml
  pull_request:
    paths:
      - rockcraft.yaml
      - rocks/**
      - tests/rock/**
      - crates/**
      - proto/**
      - Cargo.*
      - .github/workflows/rock.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pack ${{ matrix.rock }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # `path` is the rockcraft.yaml's directory; the gateway rock's is the
        # repository root, which rockcraft-pack takes as an empty path.
        rock: [gateway, supervisor, sandbox]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
          - rock: gateway
            path: ""
          - rock: supervisor
            path: rocks/supervisor
          - rock: sandbox
            path: rocks/sandbox

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Pack rock
        uses: canonical/craft-actions/rockcraft-pack@adff67a3dc8de1b95de1d25728bf83506ab701b2
        with:
          path: ${{ matrix.path }}

      - name: Run smoke tests
        run: |
          if [ "${{ matrix.rock }}" = "gateway" ]; then
            tests/rock/smoke.sh
          else
            ROCK_DIR="${{ matrix.path }}" "tests/rock/smoke-${{ matrix.rock }}.sh"
          fi

      - name: Upload rock artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rock-${{ matrix.rock }}-${{ matrix.arch }}
          path: ${{ matrix.path != '' && format('{0}/*.rock', matrix.path) || '*.rock' }}
          if-no-files-found: error

  manifest:
    name: Assemble multi-arch manifest
    needs: build
    runs-on: ubuntu-26.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download rocks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: rock-*
          path: dist

      - name: Install skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # All three rocks are built from one pinned upstream revision and have to
      # be published together: a gateway, a supervisor companion and a workload
      # boundary from different revisions do not make a working sandbox.
      - name: Push arch-specific images and assemble manifests
        run: |
          OWNER="${{ github.repository_owner }}"
          SHA="${{ github.sha }}"

          for ROCK in gateway supervisor sandbox; do
            IMAGE="ghcr.io/${OWNER}/openshell-${ROCK}"

            for ARCH in amd64 arm64; do
              FILE=$(find "dist/rock-${ROCK}-${ARCH}" -maxdepth 1 -name "*.rock" | head -1)
              skopeo copy \
                "oci-archive:${FILE}" \
                "docker://${IMAGE}:${SHA}-${ARCH}"
              skopeo copy \
                "docker://${IMAGE}:${SHA}-${ARCH}" \
                "docker://${IMAGE}:latest-${ARCH}"
            done

            skopeo copy \
              "docker://${IMAGE}:latest-amd64" \
              "docker://${IMAGE}:latest"

            docker manifest create "${IMAGE}:${SHA}" \
              "${IMAGE}:${SHA}-amd64" \
              "${IMAGE}:${SHA}-arm64"

            docker manifest push "${IMAGE}:${SHA}"
          done

      - name: Verify multi-arch manifests
        run: |
          OWNER="${{ github.repository_owner }}"
          SHA="${{ github.sha }}"

          for ROCK in gateway supervisor sandbox; do
            IMAGE="ghcr.io/${OWNER}/openshell-${ROCK}"
            MANIFEST=$(docker manifest inspect "${IMAGE}:${SHA}")
            echo "$MANIFEST" | grep -qE '"architecture"[[:space:]]*:[[:space:]]*"amd64"' \
              || (echo "ERROR: amd64 missing from ${ROCK} manifest" && exit 1)
            echo "$MANIFEST" | grep -qE '"architecture"[[:space:]]*:[[:space:]]*"arm64"' \
              || (echo "ERROR: arm64 missing from ${ROCK} manifest" && exit 1)
            echo "Multi-arch manifest OK for ${ROCK}: both linux/amd64 and linux/arm64 present."
          done
