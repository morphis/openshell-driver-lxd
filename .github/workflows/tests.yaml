name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # lxd-client knows nothing about sandboxes, so it needs nothing but an
  # initialized LXD — no OVN, and none of the image tooling below.
  lxd-client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: canonical/setup-lxd@da2ac84e727dc534215fd14cd088b9209d65893b
      - name: Install rustup
        run: sudo snap install --classic rustup
      - name: Install Rust toolchain
        run: rustup toolchain install stable --component rustfmt,clippy
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y protobuf-compiler libprotobuf-dev
      - name: Run lxd-client tests
        run: make test-lxd-client

  # Everything that creates a sandbox needs an OVN network: from OpenShell
  # v0.1.0 a sandbox's outer fence is a per-NIC LXD ACL, and LXD applies one
  # only on OVN. `setup-ovn-test-env` bootstraps a single-node MicroCloud and
  # synthesizes the spare disk and spare NIC a runner does not have, so these
  # jobs deliberately do *not* use setup-lxd-action: it would install and
  # initialize an LXD that MicroCloud then has to work around.
  sandbox-tests:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [driver, conformance, upstream-e2e]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Free disk space
        # Converting a sandbox image needs several GiB of scratch space on top
        # of LXD's own copy of it, and the gateway is built from source.
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install rustup
        run: sudo snap install --classic rustup
      - name: Install Rust toolchain
        run: rustup toolchain install stable --component rustfmt,clippy

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y protobuf-compiler libprotobuf-dev

      - name: Install image import tools
        # The driver shells out to all four while converting an OCI image into
        # an LXD one, and to busybox-static for images missing a shell or `ip`.
        run: sudo apt-get install --no-install-recommends -y skopeo umoci squashfs-tools xz-utils busybox-static

      - name: Bootstrap MicroCloud with OVN
        run: make setup-ovn-test-env

      - name: Run ${{ matrix.suite }} suite
        # setup-ovn-test-env puts the runner user in the lxd group so it can
        # reach the LXD socket, but group membership only applies to sessions
        # started after the change, and this job's session predates it.
        # Re-entering through sudo makes it resolve the groups afresh — the
        # same trick canonical/craft-actions uses for rockcraft-pack.
        run: sudo --user "$(whoami)" make test-${{ matrix.suite }}

      - name: Collect artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite }}-artifacts
          path: target/openshell-test/artifacts
          if-no-files-found: ignore
