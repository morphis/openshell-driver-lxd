name: openshell-gateway
base: ubuntu@26.04
build-base: ubuntu@26.04
version: git
summary: OpenShell gateway and LXD compute driver
description: |
  OCI rock bundling openshell-gateway (from NVIDIA/OpenShell) and
  openshell-driver-lxd (from canonical/openshell-driver-lxd) under
  Pebble. Built from pinned upstream revisions for amd64 and arm64.
  Runs non-root by default (UID 584792). No baked Pebble service
  layer — the charm supplies the authoritative runtime configuration.
license: Apache-2.0

platforms:
  amd64:
  arm64:

run-user: _daemon_

parts:
  gateway:
    plugin: rust
    source: https://github.com/NVIDIA/OpenShell.git
    source-commit: 6648bd0c290efbc41ba131ee9831ee45cd431f94 # v0.1.2
    source-subdir: crates/openshell-gateway
    build-packages:
      - pkg-config
      - libssl-dev
      - protobuf-compiler
      - libprotobuf-dev
      - libclang-dev
      - cmake
      - build-essential
      - clang
      - libz3-dev

  driver-lxd:
    plugin: rust
    source: .
    rust-path:
      - crates/openshell-driver-lxd
    build-packages:
      - pkg-config
      - libssl-dev
      - protobuf-compiler
      - libprotobuf-dev
      - cmake

  runtime-deps:
    plugin: nil
    stage-packages:
      - ca-certificates
      - iproute2
      - libssl3t64
      - libz3-4
      - busybox-static
      # openshell-driver-lxd shells out to all four of these while converting
      # an OCI image into an LXD one: skopeo copies it, umoci unpacks it,
      # mksquashfs builds the rootfs and tar -cJf builds metadata.tar.xz,
      # which needs the xz binary. A missing one fails on first create_sandbox
      # and nowhere earlier.
      - squashfs-tools
      - xz-utils
      - umoci
      - skopeo

  config:
    plugin: nil
    after:
      - gateway
      - driver-lxd
      - runtime-deps
    override-build: |
      craftctl default
      install -d -m 0755 "${CRAFT_PART_INSTALL}/var/run/openshell"
      # ca-certificates ships the public roots and a prebuilt bundle, but its
      # postinst — which writes /etc/ca-certificates.conf — never runs in a
      # rock. Without that file, anything that calls update-ca-certificates
      # (a charm adding its own CA, for example) rebuilds the bundle from an
      # empty list and silently drops every public root, so the driver can no
      # longer pull a sandbox or supervisor image from any registry.
      # The roots come from the runtime-deps part, so read them from the
      # shared stage directory rather than this part's own install dir.
      roots="${CRAFT_STAGE}/usr/share/ca-certificates"
      if [ -d "${roots}" ]; then
        install -d -m 0755 "${CRAFT_PART_INSTALL}/etc"
        ( cd "${roots}" && find . -name '*.crt' -printf '%P\n' | sort ) \
          > "${CRAFT_PART_INSTALL}/etc/ca-certificates.conf"
        chmod 0644 "${CRAFT_PART_INSTALL}/etc/ca-certificates.conf"
      fi
    permissions:
      - path: var/run/openshell
        owner: 584792
        group: 584792
        mode: "0755"
