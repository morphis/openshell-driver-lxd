name: openshell-supervisor
base: ubuntu@26.04
build-base: ubuntu@26.04
version: git
summary: OpenShell supervisor companion for the LXD compute driver
description: |
  OCI rock shipping `openshell-supervisor`, the out-of-workload half of an
  RFC 0012 sandbox, built from the same upstream revision as the
  openshell-gateway and openshell-sandbox rocks so all three ship in lock
  step. Mixing releases across the halves of a sandbox is a known way to get a
  boundary that will not attach, and building them from one pinned revision is
  what makes that impossible rather than merely unlikely.

  Unlike the sandbox rock, this one **is run**: openshell-driver-lxd converts
  it into an LXD image and boots the companion container from it. So it is a
  rootfs, not a binary carrier. The driver replaces the image's init with its
  own shell script, which needs a real `/bin/sh`, `ip` and the usual text
  tools; upstream's released supervisor image is distroless and has none of
  them, which is why this rock is Ubuntu-based rather than `bare`.

  The binary sits at `/openshell-supervisor`.
license: Apache-2.0

platforms:
  amd64:
  arm64:

parts:
  supervisor:
    plugin: rust
    source: https://github.com/NVIDIA/OpenShell.git
    # Must match the `gateway` part of ../../rockcraft.yaml and the `sandbox`
    # part of ../sandbox/rockcraft.yaml.
    source-commit: 6648bd0c290efbc41ba131ee9831ee45cd431f94 # v0.1.2
    source-subdir: crates/openshell-supervisor
    build-packages:
      - build-essential
      - clang
      - cmake
      - libclang-dev
      - libprotobuf-dev
      - libssl-dev
      - pkg-config
      - protobuf-compiler
    override-build: |
      craftctl default
      mv "${CRAFT_PART_INSTALL}/bin/openshell-supervisor" \
        "${CRAFT_PART_INSTALL}/openshell-supervisor"
      chmod 0555 "${CRAFT_PART_INSTALL}/openshell-supervisor"

  # The driver's init script runs before the supervisor and needs these; the
  # supervisor itself needs the trust store to verify the gateway. They are
  # what make this a usable companion rootfs rather than a distroless one.
  runtime-deps:
    plugin: nil
    stage-packages:
      - ca-certificates
      - curl
      - iproute2
      - libssl3t64

  config:
    plugin: nil
    after:
      - supervisor
      - runtime-deps
    override-build: |
      craftctl default
      # ca-certificates ships the public roots and a prebuilt bundle, but its
      # postinst — which writes /etc/ca-certificates.conf — never runs in a
      # rock. Without that file, anything that calls update-ca-certificates
      # rebuilds the bundle from an empty list and silently drops every public
      # root, and the supervisor can no longer verify the gateway. The roots
      # come from the runtime-deps part, so read them from the shared stage
      # directory rather than this part's own install dir.
      roots="${CRAFT_STAGE}/usr/share/ca-certificates"
      if [ -d "${roots}" ]; then
        install -d -m 0755 "${CRAFT_PART_INSTALL}/etc"
        ( cd "${roots}" && find . -name '*.crt' -printf '%P\n' | sort ) \
          > "${CRAFT_PART_INSTALL}/etc/ca-certificates.conf"
        chmod 0644 "${CRAFT_PART_INSTALL}/etc/ca-certificates.conf"
      fi
